groups:
  - name: epp-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.job }} ({{ $labels.instance }}) for at least 1 minute."

      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
            / sum by (job) (rate(http_server_requests_seconds_count[5m]))
            > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} error rate above 5%"
          description: "{{ $labels.job }} has returned 5xx responses for more than 5% of requests over the last 5 minutes."

      # Deliberately fires on any single retry-exhausted delivery, not just
      # sustained unhealthiness -- it means "a message required error
      # handling and was sent to its dead-letter topic", not "the consumer
      # is down". See KafkaErrorHandlerConfig in each consumer service.
      - alert: KafkaConsumerFailure
        expr: increase(kafka_consumer_errors_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} failed to process a message on {{ $labels.topic }}"
          description: "A message on {{ $labels.topic }} required error handling and was sent to its dead-letter topic ({{ $labels.topic }}.{{ $labels.service }}.DLT) after exhausting retries."
