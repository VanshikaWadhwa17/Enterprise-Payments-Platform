server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: epp-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/epp-(payment-service|auth-service|account-service|fraud-service|notification-service|audit-service|reconciliation-service)'
        target_label: 'service'
      # Only the 7 backend Java services emit the structured JSON logs from
      # Phase G -- postgres/redis/kafka/frontend containers aren't part of
      # this log-correlation story, so drop anything that didn't match.
      - source_labels: ['service']
        regex: '.+'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      # Labels stay low-cardinality: service/level/container only.
      # requestId/userId are parsed at query time in Grafana
      # (`| json | requestId="..."`), never promoted to labels -- doing so
      # would create a new Loki series per request.
      - json:
          expressions:
            level: level
      - labels:
          level:
