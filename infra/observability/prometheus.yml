global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

# Targets use the docker-compose *service* names and each service's
# *internal* container port (server.port), not the host-mapped port from
# docker-compose.yml -- Prometheus runs inside the same compose network.
scrape_configs:
  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8080']

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8086']

  - job_name: account-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account-service:8081']

  - job_name: fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['fraud-service:8082']

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-service:8083']

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['audit-service:8084']

  - job_name: reconciliation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['reconciliation-service:8085']
