server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Native Federation loads remoteEntry.json and exposed module chunks
    # cross-origin (shell on :4200 fetching payments on :4201, etc). The dev
    # servers allow this implicitly; plain nginx needs it spelled out.
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /remoteEntry.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
    }
}
