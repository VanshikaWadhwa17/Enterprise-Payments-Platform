<section class="payment-list">
  <header class="payment-list__header">
    <h2>Payments</h2>
    @if (canCreate()) {
    <ui-button variant="primary" (clicked)="createPayment()"
      >Create payment</ui-button
    >
    }
  </header>

  @if (loading()) {
  <ui-spinner label="Loading payments…" />
  } @else if (error()) {
  <ui-error-state [message]="error()!" (retry)="load()" />
  } @else if (payments().length === 0) {
  <ui-empty-state
    title="No payments yet"
    description="Payments you create will show up here."
  />
  } @else {
  <ui-table
    [rows]="payments()"
    [columns]="columns"
    trackByKey="id"
    (rowClick)="openPayment($event)"
    [rowActions]="rowActions"
  >
    <ng-template #rowActions let-payment>
      <ui-button variant="ghost" (clicked)="openPayment(payment)"
        >View</ui-button
      >
    </ng-template>
  </ui-table>
  }
</section>
