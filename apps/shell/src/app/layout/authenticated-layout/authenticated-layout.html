<div class="app-shell">
  <aside class="app-shell__sidebar">
    <div class="app-shell__brand">{{ title }}</div>

    <nav class="app-shell__nav">
      @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="app-shell__nav-link--active"
        class="app-shell__nav-link"
        >{{ item.label }}</a
      >
      }
    </nav>

    <div class="app-shell__sidebar-footer">
      <div class="app-shell__user">
        <span class="app-shell__user-name">{{ currentUser()?.fullName }}</span>
        <span class="app-shell__user-role">{{ currentUser()?.role }}</span>
      </div>
      <button type="button" class="app-shell__logout" (click)="logout()">
        Log out
      </button>
    </div>
  </aside>

  <main class="app-shell__main">
    <router-outlet></router-outlet>
  </main>
</div>
