<section class="signup">
  <ui-card title="Create an account">
    <form class="signup__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="signup__field">
        <span>Full name</span>
        <input type="text" formControlName="fullName" autocomplete="name" />
        @if (form.controls.fullName.invalid && form.controls.fullName.touched) {
        <small class="signup__error">Full name is required.</small>
        }
      </label>

      <label class="signup__field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="signup__error">Enter a valid email address.</small>
        }
      </label>

      <label class="signup__field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="signup__error"
          >At least 8 characters, with a letter and a number.</small
        >
        }
      </label>

      <label class="signup__field">
        <span>Confirm password</span>
        <input
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        @if (form.errors?.['passwordMismatch'] && form.controls.confirmPassword.touched) {
        <small class="signup__error">Passwords do not match.</small>
        }
      </label>

      @if (errorMessage()) {
      <p class="signup__error signup__error--form">{{ errorMessage() }}</p>
      }

      <ui-button type="submit" variant="primary" [loading]="submitting()">
        Create account
      </ui-button>
    </form>

    <div class="signup__divider"><span>or</span></div>

    <ui-button
      variant="secondary"
      [disabled]="true"
      title="Google sign-up isn't configured yet"
    >
      Sign up with Google
    </ui-button>

    <p class="signup__login-hint">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </ui-card>
</section>
