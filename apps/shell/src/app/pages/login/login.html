<section class="login">
  <ui-card title="Sign in">
    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="login__field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="login__error">Enter a valid email address.</small>
        }
      </label>

      <label class="login__field">
        <span>Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="login__error">Password is required.</small>
        }
      </label>

      @if (errorMessage()) {
      <p class="login__error login__error--form">{{ errorMessage() }}</p>
      }

      <ui-button type="submit" variant="primary" [loading]="submitting()">
        Sign in
      </ui-button>
    </form>

    <div class="login__divider"><span>or</span></div>

    <ui-button
      variant="secondary"
      [disabled]="true"
      title="Google sign-in isn't configured yet"
    >
      Continue with Google
    </ui-button>

    <p class="login__signup-hint">
      Don't have an account? <a routerLink="/signup">Sign up</a>
    </p>
  </ui-card>
</section>
