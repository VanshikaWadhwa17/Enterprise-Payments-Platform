<section class="admin">
  <header class="admin__header">
    <h2>Admin</h2>
  </header>

  @if (loading()) {
  <ui-spinner label="Loading users…" />
  } @else if (error()) {
  <ui-error-state [message]="error()!" (retry)="load()" />
  } @else if (users().length === 0) {
  <ui-empty-state title="No users" description="No users found." />
  } @else {
  <ui-table [rows]="users()" [columns]="columns" trackByKey="id" [rowActions]="rowActions">
    <ng-template #rowActions let-user>
      @if (canManageRole()) {
      <select
        class="admin__role-select"
        [disabled]="isSelf(user)"
        (change)="changeRole(user, $any($event.target).value)"
      >
        @for (role of roles; track role) {
        <option [value]="role" [selected]="role === user.role">{{ role }}</option>
        }
      </select>
      } @if (canManageStatus()) {
      <ui-button
        variant="ghost"
        [disabled]="isSelf(user)"
        (clicked)="toggleStatus(user)"
      >
        {{ user.enabled ? 'Disable' : 'Enable' }}
      </ui-button>
      }
    </ng-template>
  </ui-table>
  }
</section>
