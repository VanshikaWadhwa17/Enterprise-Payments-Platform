services:
  postgres:
    image: postgres:16-alpine
    container_name: epp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-payments}
      POSTGRES_USER: ${DB_USER:-payments}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payments}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-payments}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: epp-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: epp-kafka
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # --- Backend services -----------------------------------------------

  payment-service:
    build:
      context: ./backend/payment-service
    container_name: epp-payment-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payments
      DB_USER: ${DB_USER:-payments}
      DB_PASSWORD: ${DB_PASSWORD:-payments}
      KAFKA_BROKERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    ports:
      - '${PAYMENT_SERVICE_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  auth-service:
    build:
      context: ./backend/auth-service
    container_name: epp-auth-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: ${AUTH_DB_USER:-auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '${AUTH_SERVICE_PORT:-8086}:8086'
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: ./backend/account-service
    container_name: epp-account-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: accounts
      DB_USER: ${ACCOUNT_DB_USER:-accounts}
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-accounts}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
    ports:
      - '${ACCOUNT_SERVICE_PORT:-8081}:8081'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fraud-service:
    build:
      context: ./backend/fraud-service
    container_name: epp-fraud-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fraud
      DB_USER: ${FRAUD_DB_USER:-fraud}
      DB_PASSWORD: ${FRAUD_DB_PASSWORD:-fraud}
      KAFKA_BROKERS: kafka:19092
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4202}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    ports:
      - '${FRAUD_SERVICE_PORT:-8082}:8082'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: epp-notification-service
    environment:
      KAFKA_BROKERS: kafka:19092
    ports:
      - '${NOTIFICATION_SERVICE_PORT:-8083}:8083'
    depends_on:
      kafka:
        condition: service_started

  audit-service:
    build:
      context: ./backend/audit-service
    container_name: epp-audit-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: audit
      DB_USER: ${AUDIT_DB_USER:-audit}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit}
      KAFKA_BROKERS: kafka:19092
    ports:
      - '${AUDIT_SERVICE_PORT:-8084}:8084'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  reconciliation-service:
    build:
      context: ./backend/reconciliation-service
    container_name: epp-reconciliation-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reconciliation
      DB_USER: ${RECONCILIATION_DB_USER:-reconciliation}
      DB_PASSWORD: ${RECONCILIATION_DB_PASSWORD:-reconciliation}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4203}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    ports:
      - '${RECONCILIATION_SERVICE_PORT:-8085}:8085'
    depends_on:
      postgres:
        condition: service_healthy

  # --- Frontend (Angular shell + MFEs) ---------------------------------

  # NOTE: these URLs are read by the BROWSER (Apollo Client running client-side
  # in the SPA), not by the container itself -- that's why they point at
  # localhost:<host-mapped-port> rather than the Docker-network service name.
  # infra/40-generate-env-js.sh renders them into env.js at container start;
  # unset here they'd resolve to empty strings and break every request.
  shell:
    build:
      context: .
      dockerfile: infra/angular.Dockerfile
      args:
        APP_NAME: shell
    container_name: epp-shell
    environment:
      GRAPHQL_PAYMENTS_URL: ${GRAPHQL_PAYMENTS_URL:-http://localhost:8080/graphql}
      GRAPHQL_FRAUD_URL: ${GRAPHQL_FRAUD_URL:-http://localhost:8082/graphql}
      GRAPHQL_RECONCILIATION_URL: ${GRAPHQL_RECONCILIATION_URL:-http://localhost:8085/graphql}
      AUTH_API_URL: ${AUTH_API_URL:-http://localhost:8086}
      REMOTE_PAYMENTS_URL: ${REMOTE_PAYMENTS_URL:-http://localhost:4201/remoteEntry.json}
      REMOTE_FRAUD_URL: ${REMOTE_FRAUD_URL:-http://localhost:4202/remoteEntry.json}
      REMOTE_RECONCILIATION_URL: ${REMOTE_RECONCILIATION_URL:-http://localhost:4203/remoteEntry.json}
      REMOTE_REPORTS_URL: ${REMOTE_REPORTS_URL:-http://localhost:4204/remoteEntry.json}
      REMOTE_ADMIN_URL: ${REMOTE_ADMIN_URL:-http://localhost:4205/remoteEntry.json}
    ports:
      - '4200:80'

  payments:
    build:
      context: .
      dockerfile: infra/angular.Dockerfile
      args:
        APP_NAME: payments
    container_name: epp-payments
    environment:
      GRAPHQL_PAYMENTS_URL: ${GRAPHQL_PAYMENTS_URL:-http://localhost:8080/graphql}
    ports:
      - '4201:80'

  fraud:
    build:
      context: .
      dockerfile: infra/angular.Dockerfile
      args:
        APP_NAME: fraud
    container_name: epp-fraud
    environment:
      GRAPHQL_FRAUD_URL: ${GRAPHQL_FRAUD_URL:-http://localhost:8082/graphql}
    ports:
      - '4202:80'

  reconciliation:
    build:
      context: .
      dockerfile: infra/angular.Dockerfile
      args:
        APP_NAME: reconciliation
    container_name: epp-reconciliation
    environment:
      GRAPHQL_RECONCILIATION_URL: ${GRAPHQL_RECONCILIATION_URL:-http://localhost:8085/graphql}
    ports:
      - '4203:80'

  reports:
    build:
      context: .
      dockerfile: infra/angular.Dockerfile
      args:
        APP_NAME: reports
    container_name: epp-reports
    environment:
      GRAPHQL_PAYMENTS_URL: ${GRAPHQL_PAYMENTS_URL:-http://localhost:8080/graphql}
      GRAPHQL_FRAUD_URL: ${GRAPHQL_FRAUD_URL:-http://localhost:8082/graphql}
      GRAPHQL_RECONCILIATION_URL: ${GRAPHQL_RECONCILIATION_URL:-http://localhost:8085/graphql}
    ports:
      - '4204:80'

  admin:
    build:
      context: .
      dockerfile: infra/angular.Dockerfile
      args:
        APP_NAME: admin
    container_name: epp-admin
    environment:
      AUTH_API_URL: ${AUTH_API_URL:-http://localhost:8086}
    ports:
      - '4205:80'

volumes:
  postgres-data:
