# Optional observability stack -- Prometheus, Grafana, Loki, Promtail,
# Alertmanager. Layered on top of the base compose file, never required for
# normal local development:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Runs in the same compose project as docker-compose.yml, so these
# containers resolve payment-service, fraud-service, etc. by service name on
# the shared default network -- see infra/observability/prometheus.yml for
# the actual scrape targets.
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: epp-prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: epp-alertmanager
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '9093:9093'

  grafana:
    image: grafana/grafana:11.4.0
    container_name: epp-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.3.0
    container_name: epp-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'

  promtail:
    image: grafana/promtail:3.3.0
    container_name: epp-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
