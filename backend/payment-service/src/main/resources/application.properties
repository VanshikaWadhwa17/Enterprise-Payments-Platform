spring.application.name=payment-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:payments}
spring.datasource.username=${DB_USER:payments}
spring.datasource.password=${DB_PASSWORD:payments}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.graphql.graphiql.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss} %-5level [%X{requestId:-no-request-id}] %logger{20} - %msg%n
