spring.application.name=auth-service
server.port=${SERVER_PORT:8086}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth}
spring.datasource.username=${DB_USER:auth}
spring.datasource.password=${DB_PASSWORD:auth}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

app.jwt.secret=${AUTH_JWT_SECRET:}
app.jwt.expiration-seconds=${AUTH_JWT_EXPIRATION_SECONDS:28800}

app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
