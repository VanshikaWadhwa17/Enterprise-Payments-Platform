spring.application.name=account-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:accounts}
spring.datasource.username=${DB_USER:accounts}
spring.datasource.password=${DB_PASSWORD:accounts}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.graphql.graphiql.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss} %-5level [%X{requestId:-no-request-id}] %logger{20} - %msg%n
