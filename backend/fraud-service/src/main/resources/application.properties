spring.application.name=fraud-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:fraud}
spring.datasource.username=${DB_USER:fraud}
spring.datasource.password=${DB_PASSWORD:fraud}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.graphql.graphiql.enabled=true

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=fraud-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.fraud.event.PaymentCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.fraud.event

# Only used to publish to this service's own dead-letter topic
# (payment-events.fraud-service.DLT) when a listener exhausts retries --
# see KafkaErrorHandlerConfig.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4202}

app.jwt.secret=${AUTH_JWT_SECRET:}

app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
