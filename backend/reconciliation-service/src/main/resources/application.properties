spring.application.name=reconciliation-service
server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:reconciliation}
spring.datasource.username=${DB_USER:reconciliation}
spring.datasource.password=${DB_PASSWORD:reconciliation}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.graphql.graphiql.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4203}

app.jwt.secret=${AUTH_JWT_SECRET:}

app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
