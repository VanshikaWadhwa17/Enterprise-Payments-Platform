spring.application.name=audit-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:audit}
spring.datasource.username=${DB_USER:audit}
spring.datasource.password=${DB_PASSWORD:audit}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.audit.event.PaymentCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.audit.event

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
