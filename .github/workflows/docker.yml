name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate a CI-only JWT secret
        # payment/fraud/reconciliation-service refuse to boot without this
        # (see application.properties: app.jwt.secret=${AUTH_JWT_SECRET:}).
        # Must be generated the same way as .env.example's local-dev
        # instructions (openssl rand -base64 32 -> 44 bytes): JwtService
        # signs with jjwt's Keys.hmacShaKeyFor, which auto-selects HS256
        # only for keys in the 32-47 byte range and HS384/HS512 for longer
        # ones -- but every service's JwtDecoder is hardcoded to HS256, so a
        # secret of the wrong length signs tokens no decoder can verify.
        run: echo "AUTH_JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build all images
        run: docker compose build

      - name: Start the full stack
        run: docker compose up -d

      - name: Wait for backend services to become healthy
        run: |
          for port in 8080 8081 8082 8083 8084 8085 8086; do
            echo "Waiting for service on port $port..."
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:$port/actuator/health" > /dev/null; then
                echo "Port $port is healthy"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Service on port $port did not become healthy in time"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Log in and capture auth cookies
        run: |
          # No `set -e` here on purpose -- every call's status is checked
          # explicitly so a failure is diagnosable from the public
          # Annotations panel alone (repo logs need admin access to view).
          login_ok=false
          for i in $(seq 1 15); do
            http_code=$(curl -s -o response.txt -w "%{http_code}" -c cookies.txt -b cookies.txt \
              -X POST http://localhost:8086/api/auth/login \
              -H "Content-Type: application/json" \
              -d '{"email":"erin@epp.dev","password":"Passw0rd!"}')
            if [ "$http_code" = "200" ]; then
              login_ok=true
              break
            fi
            echo "Login attempt $i got HTTP $http_code, retrying..."
            sleep 2
          done
          if [ "$login_ok" != true ]; then
            echo "::error::Login never returned HTTP 200 after 15 attempts. Last: $http_code $(cat response.txt)"
            docker compose logs auth-service --tail=100 || true
            exit 1
          fi

          # login alone only sets epp_token; XSRF-TOKEN is seeded by the next
          # authenticated request, same as the frontend's refreshSession()
          # bootstrap call.
          me_code=$(curl -s -o me_response.txt -w "%{http_code}" -c cookies.txt -b cookies.txt \
            http://localhost:8086/api/auth/me)
          if [ "$me_code" != "200" ]; then
            echo "::error::GET /me returned HTTP $me_code, body: $(cat me_response.txt)"
            docker compose logs auth-service --tail=100 || true
            exit 1
          fi
          if ! grep -q epp_token cookies.txt || ! grep -q XSRF-TOKEN cookies.txt; then
            echo "::error::epp_token or XSRF-TOKEN cookie missing after login/me"
            exit 1
          fi

      - name: Smoke test GraphQL endpoints
        run: |
          set -e
          XSRF_TOKEN=$(grep XSRF-TOKEN cookies.txt | awk -F'\t' '{print $NF}')

          call_graphql() {
            url=$1
            query=$2
            response=$(curl -sf -b cookies.txt -X POST "$url" \
              -H "Content-Type: application/json" \
              -H "X-XSRF-TOKEN: $XSRF_TOKEN" \
              -d "{\"query\":\"$query\"}")
            echo "$response" | grep -q '"data"'
            if echo "$response" | grep -q '"errors"'; then
              echo "GraphQL errors from $url: $response"
              exit 1
            fi
          }

          # erin@epp.dev (VIEWER) has PAYMENT_VIEW, FRAUD_VIEW and
          # RECONCILIATION_VIEW -- one seeded account covers all three.
          call_graphql http://localhost:8080/graphql 'query{payments{id}}'
          call_graphql http://localhost:8082/graphql 'query{fraudCases{id}}'
          call_graphql http://localhost:8085/graphql 'query{reconciliationRecords{id}}'

          # account-service has no auth wired up yet and isn't called by the
          # frontend -- unauthenticated smoke test only.
          curl -sf -X POST http://localhost:8081/graphql -H "Content-Type: application/json" \
            -d '{"query":"query{accounts{id}}"}' | grep -q '"data"'

      - name: Smoke test admin API
        run: |
          set -e
          # carol@epp.dev is the seeded ADMIN account -- USER_VIEW is required
          # for GET /api/auth/users (UserAdminController).
          carol_code=$(curl -s -o carol_login.txt -w "%{http_code}" -c carol_cookies.txt \
            -X POST http://localhost:8086/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"carol@epp.dev","password":"Passw0rd!"}')
          if [ "$carol_code" != "200" ]; then
            echo "::error::Admin login returned HTTP $carol_code, body: $(cat carol_login.txt)"
            exit 1
          fi

          users_response=$(curl -sf -b carol_cookies.txt http://localhost:8086/api/auth/users)
          echo "$users_response" | grep -q '"email":"alice@epp.dev"'

      - name: Smoke test frontend
        run: |
          for port in 4200 4201 4202 4203 4204 4205; do
            echo "Waiting for frontend on port $port..."
            up=false
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port" > /dev/null; then
                up=true
                break
              fi
              sleep 2
            done
            if [ "$up" != true ]; then
              echo "Frontend on port $port did not come up in time"
              exit 1
            fi
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
